<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FA 会议纪要助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Noto Sans SC', 'Inter', system-ui, sans-serif; background: #F1F5F9; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
    .blink { animation: blink 1s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin .8s linear infinite; }
    @keyframes fadein { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    .fadein { animation: fadein .3s ease-out forwards; }
    @keyframes slideup { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .slideup { animation: slideup .25s ease-out forwards; }
    input[type="date"] { -webkit-appearance: none; appearance: none; text-align: left; }
  </style>
</head>
<body class="min-h-screen">

<!-- ── Header ── -->
<header class="sticky top-0 z-50 bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 shadow-lg">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
    <div>
      <h1 class="text-white font-semibold text-base sm:text-lg tracking-tight">FA 会议纪要助手</h1>
      <p class="text-blue-300 text-xs mt-0.5 hidden sm:block">投资人沟通记录 · 结构化整理</p>
    </div>
    <div id="headerBadge" class="hidden text-xs bg-blue-500/20 text-blue-200 border border-blue-500/30 rounded-full px-3 py-1">
      就绪
    </div>
  </div>
</header>

<!-- ── Main ── -->
<main class="max-w-7xl mx-auto p-4 sm:p-6">
  <div class="flex flex-col lg:flex-row gap-5">

    <!-- ════ Left Panel ════ -->
    <aside class="w-full lg:w-80 xl:w-88 shrink-0">
      <div class="lg:sticky lg:top-24 space-y-4">

        <!-- API Key -->
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
          <label class="block text-[10px] font-semibold text-slate-500 uppercase tracking-widest mb-2">DeepSeek API Key</label>
          <div class="relative">
            <input id="apiKey" type="password" placeholder="sk-..."
              class="w-full pr-9 pl-3 py-2 text-sm border border-slate-200 rounded-xl bg-slate-50 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition" />
            <button onclick="toggleKey()" tabindex="-1"
              class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition">
              <svg id="eyeShow" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <svg id="eyeHide" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
              </svg>
            </button>
          </div>
          <p class="text-[11px] text-slate-400 mt-1.5">首次填写后自动保存，下次无需重填</p>
        </div>

        <!-- Meeting Info -->
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-3">
          <p class="text-[10px] font-semibold text-slate-500 uppercase tracking-widest">会议基本信息</p>

          <div>
            <label class="block text-xs text-slate-500 mb-1">日期</label>
            <input id="meetingDate" type="date"
              class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition" />
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">投资人姓名</label>
            <input id="investorName" type="text" placeholder="例：张总"
              class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl bg-slate-50 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition" />
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">机构名称</label>
            <input id="institutionName" type="text" placeholder="例：XX 创投"
              class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl bg-slate-50 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition" />
          </div>
        </div>

        <!-- Transcript -->
        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <p class="text-[10px] font-semibold text-slate-500 uppercase tracking-widest">会议记录内容</p>
            <span id="charCount" class="text-[11px] text-slate-400">0 字</span>
          </div>
          <textarea id="transcript" rows="11"
            placeholder="粘贴通话转写文字，或手动输入会议要点..."
            class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl bg-slate-50 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition resize-none leading-relaxed"></textarea>
        </div>

        <!-- Generate Button -->
        <button id="generateBtn" onclick="generate()"
          class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-2xl shadow-md transition-all duration-150 flex items-center justify-center gap-2 text-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
          生成会议纪要
        </button>

      </div>
    </aside>

    <!-- ════ Right Panel ════ -->
    <section class="flex-1 min-w-0 space-y-4">

      <!-- Status bar -->
      <div id="statusBar" class="hidden items-center gap-3 bg-blue-50 border border-blue-200 rounded-2xl px-4 py-3">
        <span class="flex gap-1 shrink-0">
          <span class="blink w-2 h-2 bg-blue-500 rounded-full inline-block"></span>
          <span class="blink w-2 h-2 bg-blue-500 rounded-full inline-block" style="animation-delay:.2s"></span>
          <span class="blink w-2 h-2 bg-blue-500 rounded-full inline-block" style="animation-delay:.4s"></span>
        </span>
        <span id="statusText" class="text-sm text-blue-700">正在生成...</span>
      </div>

      <!-- Error bar -->
      <div id="errorBar" class="hidden bg-red-50 border border-red-200 rounded-2xl px-4 py-3">
        <p id="errorText" class="text-sm text-red-700"></p>
      </div>

      <!-- Empty state -->
      <div id="emptyState" class="flex flex-col items-center justify-center py-28 text-center fadein">
        <div class="w-20 h-20 bg-white border border-slate-200 rounded-3xl flex items-center justify-center mb-5 shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
        </div>
        <p class="text-slate-500 font-medium text-sm">填写左侧信息后点击「生成会议纪要」</p>
        <p class="text-slate-400 text-xs mt-1.5">将自动按 8 个维度结构化提取原文内容</p>
      </div>

      <!-- Output sections -->
      <div id="outputSections" class="hidden space-y-3"></div>

      <!-- Copy button -->
      <div id="copyArea" class="hidden slideup">
        <button onclick="copyAll()"
          class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold rounded-2xl shadow-md transition-all duration-150 flex items-center justify-center gap-2 text-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
          </svg>
          一键复制全文
        </button>
      </div>

    </section>
  </div>
</main>

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-sm px-5 py-2.5 rounded-full shadow-xl z-50 whitespace-nowrap">
  已复制到剪贴板 ✓
</div>

<script>
// ── Data ──────────────────────────────────────────────────────────
const SECTIONS = [
  { id: 'personal',  title: '个人情况',     icon: '👤' },
  { id: 'inst',      title: '机构情况',     icon: '🏢' },
  { id: 'team',      title: '团队情况',     icon: '👥' },
  { id: 'pref',      title: '投资偏好',     icon: '🎯' },
  { id: 'fund',      title: '基金情况',     icon: '💰' },
  { id: 'return',    title: '落地返投情况', icon: '📍' },
  { id: 'dynamic',   title: '投资动态',     icon: '📈' },
  { id: 'decision',  title: '决策情况',     icon: '⚖️' },
  { id: 'other',     title: '其他',         icon: '📝' },
];

const SYSTEM_PROMPT = `你是一位专业的 FA 会议纪要整理助理。
你的任务是：从会议记录中提取投资人（被访谈方）分享的全部信息，按指定分类整理成专业的第三人称叙述。

第一步：先判断谁是投资人——通常是被邀请介绍机构情况的那一方（被提问方）。
第二步：逐句扫描投资人的发言，把所有有价值的信息归入对应分类，一条都不能遗漏。

严格要求：
- 【完整性第一】投资人说的每一条有价值的信息都必须记录，不得因为觉得"次要"而跳过
- 只记录投资人的发言；FA（提问方）的话仅作为背景，不纳入纪要
- 使用第三人称书面叙述，禁止出现"我们""我""你"，用机构名称或"该投资人"代替
- 忠实于原意，可将口语转为书面语，但不捏造、不推断原文没有的信息
- 语句通顺简洁，去除口头禅和无意义填充词
- 标题中已有投资人姓名和机构名称，内容中不要重复
- 【子项规则】每个大类只列出原文确实提及的内容；没有提及的子项直接跳过（不写"未提及"）；整个大类都没有相关内容时才写：- 未提及
- 子项名称根据实际内容自行判断，不要套用与本次对话无关的字段
- 严格按照指定格式输出，不要添加额外说明`;

function buildUserPrompt(date, name, inst, transcript) {
  return `会议日期：${date}
投资人：${name}，机构：${inst}

会议记录：
${transcript}

请严格按以下格式输出，将原文内容整理为专业的第三人称书面表述：
- 禁止出现"我们""我""你"，用机构名称或"该投资人"代替
- 每个大类下，根据会议内容自行决定列出哪些要点，每条用 "- 要点名称：内容" 格式
- 内容必须完整，不可遗漏原文中属于该类的信息
- 该大类无相关内容时，只写一条：- 未提及

## 1. 个人情况
（投资人自述的职业经历、过往任职机构、专业背景、何时加入当前机构等；姓名已在标题，不要重复）

## 2. 机构情况
（机构成立背景、发展历史、性质定位、覆盖地域、业务范围等；机构名称已在标题，不要重复）

## 3. 团队情况
（团队规模、核心人员、内部分工、资源调动方式等）

## 4. 投资偏好
（偏好行业、投资阶段、单笔金额、对企业的要求、地域偏好等）

## 5. 基金情况
（各基金名称、规模、LP构成、已投项目等，逐一列明）

## 6. 落地返投情况
（是否要求落地、返投比例、落地城市/园区要求等）

## 7. 投资动态
（已出手案例及金额、今年KPI、在谈项目、出手频率等）

## 8. 决策情况
（决策流程、关键决策人、决策周期等）

## 9. 其他
（不属于以上分类的其他重要信息）
`;
}

// ── Init ──────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('ds_api_key');
  if (saved) document.getElementById('apiKey').value = saved;

  document.getElementById('meetingDate').value = new Date().toISOString().split('T')[0];

  document.getElementById('transcript').addEventListener('input', function () {
    document.getElementById('charCount').textContent = this.value.length + ' 字';
  });

  document.getElementById('apiKey').addEventListener('blur', function () {
    if (this.value) localStorage.setItem('ds_api_key', this.value);
  });
});

// ── Toggle API key visibility ──────────────────────────────────────
function toggleKey() {
  const inp = document.getElementById('apiKey');
  const show = document.getElementById('eyeShow');
  const hide = document.getElementById('eyeHide');
  if (inp.type === 'password') {
    inp.type = 'text'; show.classList.add('hidden'); hide.classList.remove('hidden');
  } else {
    inp.type = 'password'; show.classList.remove('hidden'); hide.classList.add('hidden');
  }
}

// ── UI helpers ─────────────────────────────────────────────────────
function showStatus(txt) {
  const bar = document.getElementById('statusBar');
  bar.classList.remove('hidden'); bar.classList.add('flex');
  document.getElementById('statusText').textContent = txt;
  document.getElementById('errorBar').classList.add('hidden');
}
function hideStatus() {
  const bar = document.getElementById('statusBar');
  bar.classList.add('hidden'); bar.classList.remove('flex');
}
function showError(msg) {
  document.getElementById('errorBar').classList.remove('hidden');
  document.getElementById('errorText').textContent = msg;
  hideStatus();
}
function setBusy(busy) {
  const btn = document.getElementById('generateBtn');
  if (busy) {
    btn.disabled = true;
    btn.innerHTML = `<svg class="spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>生成中...`;
    btn.classList.replace('bg-blue-600', 'bg-blue-400');
    btn.classList.add('cursor-not-allowed');
  } else {
    btn.disabled = false;
    btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>生成会议纪要`;
    btn.classList.replace('bg-blue-400', 'bg-blue-600');
    btn.classList.remove('cursor-not-allowed');
  }
}

// ── Build section cards (loading state) ────────────────────────────
function initSections() {
  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('copyArea').classList.add('hidden');
  const out = document.getElementById('outputSections');
  out.classList.remove('hidden');
  out.innerHTML = '';

  SECTIONS.forEach((s, idx) => {
    const card = document.createElement('div');
    card.id = `card-${s.id}`;
    card.className = 'bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm fadein';
    card.style.animationDelay = `${idx * 40}ms`;
    card.innerHTML = `
      <div class="px-4 py-3 bg-gradient-to-r from-slate-50 to-white border-b border-slate-200 flex items-center gap-2">
        <span class="text-sm leading-none">${s.icon}</span>
        <span class="font-semibold text-slate-800 text-sm">${idx + 1}. ${s.title}</span>
        <span id="spin-${s.id}" class="ml-auto flex gap-1">
          <span class="blink w-1.5 h-1.5 bg-blue-400 rounded-full inline-block"></span>
          <span class="blink w-1.5 h-1.5 bg-blue-400 rounded-full inline-block" style="animation-delay:.2s"></span>
          <span class="blink w-1.5 h-1.5 bg-blue-400 rounded-full inline-block" style="animation-delay:.4s"></span>
        </span>
      </div>
      <div id="body-${s.id}" class="px-4 py-3 text-sm text-slate-300 italic">等待中…</div>`;
    out.appendChild(card);
  });
}

// ── Parse AI response → fill cards dynamically ─────────────────────
function renderParsed(raw) {
  const sectionBlocks = raw.split(/(?=##\s*\d+\.)/);

  const parsed = {}; // title → [{key, val}]
  for (const block of sectionBlocks) {
    const titleMatch = block.match(/##\s*\d+\.\s*(.+)/);
    if (!titleMatch) continue;
    const title = titleMatch[1].trim();
    const bullets = [];
    for (const line of block.split('\n')) {
      const m = line.match(/^-\s*(.+?)[：:]\s*(.+)$/);
      if (m) bullets.push({ key: m[1].trim(), val: m[2].trim() });
      else if (/^-\s*未提及/.test(line.trim())) bullets.push({ key: null, val: '未提及' });
    }
    parsed[title] = bullets;
  }

  SECTIONS.forEach(s => {
    document.getElementById(`spin-${s.id}`)?.classList.add('hidden');

    // Match section by title
    let bullets = null;
    for (const [title, data] of Object.entries(parsed)) {
      if (title.includes(s.title) || s.title.includes(title)) { bullets = data; break; }
    }

    const body = document.getElementById(`body-${s.id}`);
    if (!body) return;

    if (!bullets || bullets.length === 0) {
      body.innerHTML = `<span class="text-slate-400 italic">未提及</span>`;
      return;
    }

    // Single "未提及" entry
    if (bullets.length === 1 && bullets[0].val === '未提及') {
      body.innerHTML = `<span class="text-slate-400 italic">未提及</span>`;
      return;
    }

    // Render dynamic rows
    body.className = '';
    body.innerHTML = bullets.map(({ key, val }) => {
      const isNA = val === '未提及';
      return `<div class="flex items-start py-2.5 px-4 border-b border-slate-100 last:border-0">
        ${key ? `<span class="text-xs font-medium text-slate-500 w-28 shrink-0 pt-0.5 leading-relaxed">${key}</span>` : ''}
        <span contenteditable="true" spellcheck="false"
          class="text-sm ${isNA ? 'text-slate-400 italic' : 'text-slate-800'} flex-1 leading-relaxed outline-none rounded px-1 -mx-1 hover:bg-slate-50 focus:bg-blue-50 focus:ring-1 focus:ring-blue-300 transition-colors cursor-text">${val}</span>
      </div>`;
    }).join('');
  });
}

// ── Generate ────────────────────────────────────────────────────────
async function generate() {
  const apiKey    = document.getElementById('apiKey').value.trim();
  const date      = document.getElementById('meetingDate').value || '（未填写）';
  const investor  = document.getElementById('investorName').value.trim() || '（未填写）';
  const inst      = document.getElementById('institutionName').value.trim() || '（未填写）';
  const transcript = document.getElementById('transcript').value.trim();

  if (!apiKey)     { showError('请先填写 DeepSeek API Key'); return; }
  if (!transcript) { showError('请填写会议记录内容'); return; }

  localStorage.setItem('ds_api_key', apiKey);

  document.getElementById('errorBar').classList.add('hidden');
  setBusy(true);
  showStatus('正在连接 DeepSeek API…');
  initSections();

  try {
    showStatus('AI 正在提取信息，请稍候…');

    const resp = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`,
      },
      body: JSON.stringify({
        model: 'deepseek-chat',
        stream: true,
        temperature: 0.1,
        max_tokens: 6000,
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          { role: 'user',   content: buildUserPrompt(date, investor, inst, transcript) },
        ],
      }),
    });

    if (!resp.ok) {
      let errMsg = `HTTP ${resp.status}`;
      try { const e = await resp.json(); errMsg = e?.error?.message || errMsg; } catch {}
      throw new Error(errMsg);
    }

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let full = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      for (const line of chunk.split('\n')) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') break;
        try {
          const delta = JSON.parse(data)?.choices?.[0]?.delta?.content || '';
          full += delta;
        } catch {}
      }
    }

    renderParsed(full);
    hideStatus();

    // Store for copy
    window._memo = { date, investor, inst };
    document.getElementById('copyArea').classList.remove('hidden');

  } catch (err) {
    showError('生成失败：' + err.message);
    SECTIONS.forEach(s => document.getElementById(`spin-${s.id}`)?.classList.add('hidden'));
  } finally {
    setBusy(false);
  }
}

// ── Copy all ────────────────────────────────────────────────────────
function copyAll() {
  const { date, investor, inst } = window._memo || {};
  let txt = `会议纪要\n${'─'.repeat(30)}\n`;
  txt += `日期：${date || ''}\n`;
  txt += `投资人：${investor || ''}　机构：${inst || ''}\n`;
  txt += `${'─'.repeat(30)}\n\n`;

  SECTIONS.forEach((s, idx) => {
    txt += `${idx + 1}. ${s.title}\n`;
    const body = document.getElementById(`body-${s.id}`);
    if (!body) { txt += '\n'; return; }
    // Extract rows: each .flex div is a bullet
    const rows = body.querySelectorAll('.flex');
    if (rows.length === 0) {
      // Plain text (未提及)
      txt += `　${body.textContent.trim()}\n`;
    } else {
      rows.forEach(row => {
        const keyEl = row.querySelector('span:first-child');
        const valEl = row.querySelector('span:last-child');
        if (keyEl && valEl && keyEl !== valEl) {
          txt += `　· ${keyEl.textContent.trim()}：${valEl.textContent.trim()}\n`;
        } else if (valEl) {
          txt += `　· ${valEl.textContent.trim()}\n`;
        }
      });
    }
    txt += '\n';
  });

  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
  };

  (navigator.clipboard ? navigator.clipboard.writeText(txt).catch(fallback) : Promise.resolve(fallback()))
    .finally(showToast);
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2200);
}
</script>
